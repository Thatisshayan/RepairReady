name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update npm
        # The committed package-lock.json was generated with a newer npm (11.x) than the one
        # bundled with actions/setup-node's Node images; older npm's stricter `npm ci` validation
        # then reports optional-dependency entries (e.g. esbuild's platform binaries) as "missing"
        # even though the lockfile is internally consistent. Matching npm's major version avoids
        # the false mismatch instead of masking it with `npm install`.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
